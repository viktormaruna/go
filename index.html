<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- GitHub Pages cannot set response headers, so the policy ships as a meta
       tag. It is defence-in-depth around the remote feed content this page
       injects: img-src and connect-src are the directives that matter, since
       they block the beacon and exfiltration routes an injected payload would
       reach for. script-src has to allow inline (the whole app is one inline
       script element), so this constrains what injected markup can reach, not what
       it can run — the escaping at the injection points is still the primary
       defence. Adding a source to the page means adding it to connect-src. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'none';
    script-src 'unsafe-inline';
    style-src 'unsafe-inline';
    img-src 'self' data:;
    connect-src https://api.met.no https://air-quality-api.open-meteo.com
                https://services.swpc.noaa.gov https://api.bigdatacloud.net
                https://metar.vatsim.net https://api.rss2json.com
                https://api.allorigins.win;
    form-action https://search.brave.com;
    base-uri 'none';
    frame-src 'none';">

  <title>go · viktormaruna</title>
  <!-- Publicly reachable but deliberately kept out of search engines -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0e12" media="(prefers-color-scheme: dark)">
  <!-- No webfont is loaded. Inter stays first in the stack below, so it is used
       when installed locally, and the system UI font is used otherwise. Loading
       it from Google cost a render-blocking request that also reported every
       visit; self-hosting it would need the latin-ext subset for the Slovak
       name-day names, which is more weight than a start page should carry. -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.85em%22 font-size=%22100%22 fill=%22%23888%22>⌂</text></svg>">

  <style>
    /* ===== Design tokens ===== */
    :root {
      color-scheme: light dark;

      --bg: #f6f7f9;
      --surface: #ffffff;
      --text: #16181d;
      --muted: #69707d;
      --accent: #4f46e5;
      --border: #e9ebef;
      --card-border: transparent;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.04), 0 10px 28px -16px rgb(0 0 0 / 0.14);

      --radius: 16px;
      --radius-sm: 8px;

      /* Semantic value colors (weather metrics) */
      --c-cold: #3b82f6;
      --c-cool: #0891b2;
      --c-warm: #d97706;
      --c-hot: #dc2626;
      --c-ok: #16a34a;

      /* Type scale — two focal sizes + four text sizes, nothing else */
      --fs-display: 2.5rem;   /* 40px — clock */
      --fs-hero: 1.9rem;      /* 30px — current temperature */
      --fs-lg: 1rem;          /* 16px — search input (16px also avoids iOS zoom) */
      --fs-md: 0.875rem;      /* 14px — date, news headlines */
      --fs-sm: 0.8125rem;     /* 13px — card labels, condition text */
      --fs-xs: 0.75rem;       /* 12px — meta lines, weather details, countdowns */
      --fs-2xs: 0.6875rem;    /* 11px — densest: calendar grid, forecast, tags */

      --gap: 14px;
      --pad: 16px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0e12;
        --surface: #14171e;
        --text: #e9ecf2;
        --muted: #8b93a3;
        --accent: #8b93ff;
        --border: #232833;
        --card-border: #20242e;
        --shadow: none;

        --c-cold: #60a5fa;
        --c-cool: #22d3ee;
        --c-warm: #fbbf24;
        --c-hot: #f87171;
        --c-ok: #4ade80;
      }
    }

    /* ===== Base ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.45;
      background: var(--bg);
      color: var(--text);
      accent-color: var(--accent);
      -webkit-font-smoothing: antialiased;
      font-feature-settings: "tnum"; /* tabular numerals everywhere */
    }

    ::selection { background: color-mix(in srgb, var(--accent) 22%, transparent); }

    a { transition: color 0.15s; }
    button { transition: color 0.15s, border-color 0.15s; }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
      border-radius: 4px;
    }

    .layout {
      display: flex;
      flex-direction: column;
      gap: var(--gap);
      max-width: 1600px;
      margin: 0 auto;
      padding: 22px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: var(--pad) 16px;
      box-shadow: var(--shadow);
    }

    /* Shared card label */
    .card h2 {
      font-size: var(--fs-sm);
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.01em;
      margin-bottom: 7px;
    }

    /* Shared hairline separator inside cards */
    .hairline {
      margin-top: 5px;
      padding-top: 4px;
      border-top: 1px solid var(--border);
    }

    /* ===== Header: clock + date meta ===== */
    .top {
      display: flex;
      align-items: center;  /* clock and the meta block share one centre line */
      gap: 16px;
      flex-wrap: wrap;
      padding: 0 4px;
    }

    #clock {
      display: flex;
      align-items: center;
      font-size: var(--fs-display);
      font-weight: 600;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    #c-s::before { content: ":"; }

    /* Timezone rides with the clock — it qualifies the time itself, not the
       date. Small two-line stack (abbreviation over UTC offset) so it reads
       as a unit label on the number, like the unit on a measurement. */
    #c-tz {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-left: 12px;
      font-size: var(--fs-2xs);
      font-weight: 500;
      letter-spacing: 0;
      font-variant-numeric: normal;
      line-height: 1;
      color: var(--muted);
    }

    /* Meta reads as two tiers: the date, then one muted line placing it —
       week of the year, location, and the day's name-day. A hairline rule
       separates it from the clock so the two never look like one run-on line. */
    .time-meta {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding-left: 18px;
      border-left: 1px solid var(--border);
      line-height: 1.35;
    }

    #date { color: var(--text); font-size: var(--fs-md); font-weight: 500; }

    /* Week + name day: one muted line, dot-separated */
    .meta-line { display: flex; flex-wrap: wrap; color: var(--muted); font-size: var(--fs-2xs); }
    .meta-line > * + *::before { content: "·"; margin: 0 7px; opacity: 0.5; }

    /* Location — its own block right of the date, behind the same hairline
       rule that separates the clock from the meta. Pin icon + place name. */
    #c-place {
      display: flex;
      align-items: center;
      align-self: stretch;
      gap: 7px;
      padding-left: 18px;
      border-left: 1px solid var(--border);
      color: var(--text);
      font-size: var(--fs-md);
      font-weight: 500; /* matches #date */
    }
    #c-place svg { width: 14px; height: 14px; flex: none; color: var(--muted); }

    /* Chip — weather footer */
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 9px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--muted) 10%, transparent);
      color: var(--muted);
      font-size: var(--fs-2xs);
      line-height: 1.7;
      white-space: nowrap;
      text-decoration: none;
    }

    a.chip:hover { color: var(--text); }

    /* ===== Search — full-width pill: icon, input, engine switcher ===== */
    .search {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 540px;  /* left-aligned, compact at rest… */
      margin-right: auto;
      padding: 6px 6px 6px 18px;
      background: var(--surface);
      border: 1px solid var(--card-border);
      border-radius: 999px;
      box-shadow: var(--shadow);
      transition: max-width 0.25s ease, box-shadow 0.18s;
    }

    .search:focus-within {
      max-width: 100%;   /* …expands to the right while you type */
      box-shadow: var(--shadow), 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
    }

    .s-ico { width: 16px; height: 16px; color: var(--muted); flex: none; }

    .search input {
      flex: 1;
      min-width: 0;
      padding: 8px 0;
      font-size: var(--fs-lg);
      border: none;
      background: transparent;
      color: var(--text);
      outline: none;
    }

    .search input::placeholder { color: var(--muted); }

    /* Segmented control */
    .engines {
      display: flex;
      gap: 2px;
      flex: none;
      padding: 3px;
      background: color-mix(in srgb, var(--muted) 11%, transparent);
      border-radius: 999px;
    }

    .engines button {
      padding: 5px 13px;
      font-size: var(--fs-xs);
      font-weight: 500;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: background 0.15s, color 0.15s, box-shadow 0.15s;
    }

    .engines button:hover { color: var(--text); }

    .engines button.active {
      background: var(--surface);
      color: var(--text);
      font-weight: 600;
      box-shadow: 0 1px 3px rgb(0 0 0 / 0.14);
    }

    /* ===== Data row: links · weather · calendar · news (tops aligned) ===== */
    .row {
      display: grid;
      grid-template-columns: auto minmax(0, 1.9fr) minmax(0, 1fr) 330px;
      gap: var(--gap);
      align-items: start;
    }

    /* ===== Weather ===== */
    .wx-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    /* Hero: big icon + temperature, condition and place stacked beside it */
    .wx-now { display: flex; align-items: center; gap: 12px; }
    .wx-now .i { font-size: 1.7rem; line-height: 1; filter: grayscale(1); opacity: 0.85; }
    .wx-now .t {
      font-size: var(--fs-hero);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1;
      font-variant-numeric: proportional-nums; /* tabular looks loose at display size */
    }
    .wx-now .d { color: var(--muted); font-size: var(--fs-sm); line-height: 1.35; }
    .wx-now .d b { display: block; color: var(--text); font-weight: 500; }

    /* Forecast: five subtle chips */
    .wx-days {
      display: grid;
      grid-template-columns: repeat(5, minmax(52px, 1fr));
      gap: 5px;
      text-align: center;
      font-size: var(--fs-2xs);
      line-height: 1.35;
    }

    .wx-days > div {
      padding: 5px 2px;
      border-radius: 10px;
      background: color-mix(in srgb, var(--muted) 8%, transparent);
    }

    .wx-days .dn { color: var(--muted); }
    .wx-days .di { font-size: var(--fs-md); filter: grayscale(1); opacity: 0.85; }
    .wx-days .hi { font-weight: 600; }
    .wx-days .lo { color: var(--muted); }
    .wx-days .pr { color: var(--c-cold); min-height: 1em; }

    /* Today by the hour — the horizon between "now" and the day chips */
    .wx-hours {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 2px;
      padding-top: 9px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: var(--fs-2xs);
      line-height: 1.4;
    }
    .wx-hours .hn { color: var(--muted); }
    .wx-hours .hicon { font-size: var(--fs-sm); filter: grayscale(1); opacity: 0.85; }
    .wx-hours .hp { color: var(--c-cold); min-height: 1em; }

    /* One-sentence rain outlook under the hourly strip */
    .wx-rainline { font-size: var(--fs-xs); color: var(--muted); margin: 3px 2px 10px; }

    /* Metrics, grouped by what they describe — one labelled column per group
       (Air · Wind · Sky · Next hour), label:value rows inside. Scanning is
       two-step: find the group, read down. */
    .wx-det {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px 22px;
      padding: 12px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      align-items: start;
    }

    .wx-g { min-width: 0; }
    .wx-g .gt {
      color: var(--muted);
      font-size: var(--fs-2xs);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }
    .wx-g .r { display: flex; justify-content: space-between; gap: 8px; line-height: 1.7; }
    .wx-g .k { color: var(--muted); font-size: var(--fs-xs); white-space: nowrap; }
    .wx-g .v { font-size: var(--fs-xs); font-weight: 600; text-align: right; white-space: nowrap; }

    /* Wind-direction arrow — rotated to the way the wind blows */
    .wdir { display: inline-block; line-height: 1; color: var(--muted); }

    #wx-status { color: var(--muted); font-size: var(--fs-sm); }

    .wx-extra {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      margin-top: 11px;
      font-size: var(--fs-2xs);
      color: var(--muted);
    }

    /* Named slots keep the async chips (AQI, Kp) in a fixed position instead
       of whichever order the responses happen to arrive in */
    #wx-aqi, #wx-kp { display: contents; }
    .wx-extra .src { margin-left: auto; } /* attribution sits apart, on the right */
    #wx-metar { margin-top: 6px; padding: 0 2px; }
    .wx-extra .alert { color: var(--accent); font-weight: 600; margin-left: 3px; }

    /* SHMÚ / MeteoAlarm warnings — visible only when a warning is active */
    .wx-alert {
      font-size: var(--fs-xs);
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 6px;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--border);
    }

    /* ===== Calendar + countdowns ===== */
    .cal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: var(--fs-xs);
    }

    .cal-head .m { font-weight: 600; }

    .cal-head button {
      background: none;
      border: none;
      color: var(--muted);
      font-size: var(--fs-md);
      cursor: pointer;
      padding: 0 5px;
      line-height: 1;
      border-radius: 6px;
    }

    .cal-head button:hover { color: var(--accent); }

    .cal {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
      text-align: center;
      font-size: var(--fs-2xs);
      line-height: 1.85;
    }

    .cal .h { color: var(--muted); font-weight: 500; }
    .cal .c { border-radius: 999px; }
    .cal .o { color: color-mix(in srgb, var(--muted) 35%, transparent); }
    .cal .today { background: var(--accent); color: #fff; font-weight: 600; }
    .cal .we:not(.today) { color: var(--muted); }

    .cd { font-size: var(--fs-xs); }
    .cd div { display: flex; justify-content: space-between; padding: 1px 0; }
    .cd .v { color: var(--muted); font-variant-numeric: tabular-nums; }

    /* ===== Quick-link rail (favicon-only, left side) ===== */
    .rail { padding: var(--pad) 10px; }
    .rail h2 { margin-bottom: 8px; }

    .ico-row { display: flex; flex-direction: column; gap: 3px; }

    .ico-link {
      display: inline-flex;
      padding: 8px;
      border-radius: 10px;
      line-height: 0;
      transition: background 0.15s, transform 0.15s;
    }

    .ico-link:hover {
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      transform: translateY(-1px);
    }

    .ico-link img { width: 20px; height: 20px; }

    /* ===== News sidebar ===== */
    .news {
      max-height: 74vh;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .news::-webkit-scrollbar { width: 4px; }
    .news::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* Shared "last refreshed" stamp in card headings (news, weather) */
    .card h2 { display: flex; justify-content: space-between; align-items: baseline; }
    .card h2 .upd { color: var(--muted); font-size: var(--fs-2xs); font-weight: 400; }

    #news-list { display: flex; flex-direction: column; gap: 1px; }
    .n-empty { color: var(--muted); font-size: var(--fs-xs); padding: 4px 0; }

    .n-item {
      display: block;
      padding: 8px 10px;
      margin: 0 -10px;
      border-radius: 10px;
      text-decoration: none;
      color: var(--text);
      transition: background 0.13s;
    }

    .n-item:hover { background: color-mix(in srgb, var(--muted) 9%, transparent); }
    .n-item + .n-item { box-shadow: 0 -1px 0 color-mix(in srgb, var(--border) 55%, transparent); }
    .n-item:hover, .n-item:hover + .n-item { box-shadow: none; }

    /* Meta row: source dot + name on the left, time on the right */
    .n-item .meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 3px;
      font-size: var(--fs-2xs);
      line-height: 1;
    }

    .n-item .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      flex: none;
    }

    .n-item .src {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      font-weight: 600;
    }

    .n-item .tt {
      margin-left: auto;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    /* Headline: at most three lines, full text in the tooltip */
    .n-item .h {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      font-size: var(--fs-md);
      font-weight: 450;
      line-height: 1.4;
    }

    .n-item:hover .h { color: var(--accent); }

    /* ===== Responsive ===== */
    @media (max-width: 1200px) {
      /* News moves below, spanning the full width */
      .row { grid-template-columns: auto minmax(0, 1.9fr) minmax(0, 1fr); }
      .news { grid-column: 1 / -1; max-height: 420px; }
    }

    @media (max-width: 820px) {
      /* Everything stacks; the rail turns into a horizontal bar on top */
      .row { grid-template-columns: minmax(0, 1fr); }
      .wx-det { grid-template-columns: 1fr 1fr; }
      .rail { grid-column: 1 / -1; }
      .ico-row { flex-direction: row; flex-wrap: wrap; }
    }

    @media (max-width: 620px) {
      :root { --gap: 10px; --pad: 14px; --fs-display: 2.1rem; --fs-hero: 1.7rem; }
      .layout { padding: 12px; }
      .top { gap: 12px; padding: 0 2px 2px; }
      /* the rules read as stray lines once the header wraps to two rows */
      .time-meta, #c-place { padding-left: 0; border-left: 0; }
      .search { padding-left: 14px; }
      .engines button { padding: 6px 10px; }
      .wx-top { gap: 12px; }
      .wx-days { width: 100%; }
      .n-item { padding: 11px 0; }        /* comfortable tap targets */
      .ico-link { padding: 9px; }
      .cal { font-size: var(--fs-xs); line-height: 2.1; }
    }

  </style>
</head>
<body>
  <div class="layout">

    <!-- 1. Time — the page's anchor -->
    <header class="top">
      <div id="clock" title="Local time (24-hour)">
        <span id="c-hm">--:--</span><span id="c-s">--</span>
        <span id="c-tz" title="Your timezone and its offset from UTC">
          <span id="c-tz-abbr"></span>
          <span id="c-tz-off"></span>
        </span>
      </div>
      <div class="time-meta">
        <div id="date" title="Today's date"></div>
        <div class="meta-line">
          <span id="c-week" title="ISO week number"></span>
          <span id="nameday" hidden
                title="Slovak name-day calendar (meniny) — people with this name celebrate today"></span>
        </div>
      </div>
      <div id="c-place" hidden
           title="Approximate location the weather is shown for (browser geolocation, or the built-in fallback)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle>
        </svg>
        <span id="c-place-name"></span>
      </div>
    </header>

    <!-- 2. Search — the primary action -->
    <!-- action/name are a no-JS fallback: a plain submit still searches Brave -->
    <form class="search" id="search-form" role="search" action="https://search.brave.com/search" method="get" target="_blank">
      <svg class="s-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line>
      </svg>
      <input type="search" name="q" id="q" placeholder="Search…" autocomplete="off"
             title="Enter searches with the selected engine · !b !p !c prefixes override it · press / anywhere to jump here">
      <div class="engines" role="group" aria-label="Search engine">
        <button type="button" data-e="brave" title="Brave Search — classic private web search">Brave</button>
        <button type="button" data-e="perplexity" title="Perplexity — AI answer with cited sources">Perplexity</button>
        <button type="button" data-e="claude" title="Claude — opens a new AI chat (needs claude.ai login)">Claude</button>
      </div>
    </form>

    <!-- 3. Data at a glance — rail and cards share one row, tops aligned -->
    <div class="row">
          <!-- Quick-link rail — label + favicon column -->
      <nav class="card rail" id="bm" aria-label="Quick links" title="Quick links — edit the ICON_LINKS list in the page source to change them"></nav>

      <div class="card">
        <h2>Weather <span class="upd" id="wx-upd" title="Last refreshed"></span></h2>
        <div id="wx-alerts" class="wx-alert" hidden></div>
        <div id="wx"><span id="wx-status">Loading weather…</span></div>
      </div>

      <div class="card">

    /* ================= Weather (yr.no / MET Norway) + AQI + aurora ================= */
    // MET's terms ask API clients to identify themselves via User-Agent, which
    // browser JS can't set. Fine for a low-volume personal page; route through

    async function loadWeather() {
      try {
        const now = new Date();
        const om = -now.getTimezoneOffset();
        const tzOff = `${om >= 0 ? "+" : "-"}${String(Math.trunc(Math.abs(om) / 60)).padStart(2, "0")}:${String(Math.abs(om) % 60).padStart(2, "0")}`;
        const dateStr = now.toLocaleDateString("sv"); // YYYY-MM-DD

        const [fRes, sRes] = await Promise.allSettled([
          fetch(`https://api.met.no/weatherapi/locationforecast/2.0/complete?lat=${LOCATION.lat}&lon=${LOCATION.lon}`),

        const series = (await fRes.value.json()).properties.timeseries;

        const det = cur.instant.details;
        const curSym = (cur.next_1_hours || cur.next_6_hours || cur.next_12_hours)?.summary.symbol_code;

        const p0 = det.air_pressure_at_sea_level;
        const t0 = new Date(series[0].time); // anchor both ends to the series

          ?.data.instant.details.air_pressure_at_sea_level;
        const dp = p6 != null ? p6 - p0 : null;
        const pTrend = dp == null ? "" : dp >= 1 ? " ↗" : dp <= -1 ? " ↘" : " →";
        const pTrendTip = dp == null ? "" :
          ` Trend: ${dp >= 1 ? "rising" : dp <= -1 ? "falling" : "steady"} (${dp >= 0 ? "+" : ""}${dp.toFixed(1)} hPa over the next 6 h).`;
        const R = (k, v, tip) => `<div class="r"${tip ? ` title="${tip}"` : ""}><span class="k">${k}</span><span class="v">${v}</span></div>`;
        const G = (title, rows) => rows.join("") ? `<div class="wx-g"><div class="gt">${title}</div>${rows.join("")}</div>` : "";

        const groups = [
          G("Air", [
            R("Humidity", `${Math.round(det.relative_humidity)}%`,
              "Relative humidity — how much moisture the air holds vs. its maximum"),
            det.dew_point_temperature != null ? R("Dew point", col(`${Math.round(det.dew_point_temperature)}°`, dewC(det.dew_point_temperature)),
              "Temperature at which dew would form — the closer to the air temperature, the muggier it feels") : "",
            R("Pressure", `${Math.round(p0)} hPa${pTrend}`,
              `Air pressure at sea level — falling pressure usually signals worsening weather.${pTrendTip}`),
          ]),
          G("Wind", [
            R("Speed", col(`${Math.round(det.wind_speed)} m/s`, windC(det.wind_speed)),
              "Average wind speed"),
            det.wind_speed_of_gust != null ? R("Gusts", col(`${Math.round(det.wind_speed_of_gust)} m/s`, windC(det.wind_speed_of_gust)),
              "Peak wind gust speed") : "",
            R("Direction", `<span class="wdir" style="transform:rotate(${Math.round(det.wind_from_direction + 180) % 360}deg)">↑</span> ${compass(det.wind_from_direction)}`,
              `Wind from ${compass(det.wind_from_direction)} (${Math.round(det.wind_from_direction)}°) — the arrow points the way it blows`),
          ]),
          G("Sky", [
            R("Clouds", `${Math.round(det.cloud_area_fraction)}%`,
              "Share of the sky covered by clouds"),
            det.cloud_area_fraction_low != null ? R("Layers", `${Math.round(det.cloud_area_fraction_low)}·${Math.round(det.cloud_area_fraction_medium)}·${Math.round(det.cloud_area_fraction_high)}%`,
              "Cloud cover split by altitude: low · medium · high") : "",
            det.fog_area_fraction != null ? R("Fog", `${Math.round(det.fog_area_fraction)}%`,
              "Area covered by fog") : "",
            det.ultraviolet_index_clear_sky != null ? R("UV", col(Math.round(det.ultraviolet_index_clear_sky), uvC(det.ultraviolet_index_clear_sky)),

          G("Next hour", [

        const byDay = new Map();
        for (const ts of series) {
          const dt = new Date(ts.time);
          const key = dt.toLocaleDateString("sv");
          let d = byDay.get(key);
          if (!d) byDay.set(key, d = { min: Infinity, max: -Infinity, precip: 0, sym: null, symHour: 99 });
          const t = ts.data.instant.details.air_temperature;
          if (t < d.min) d.min = t;
          if (t > d.max) d.max = t;
          // hourly steps carry next_1_hours; the 6-hourly tail only next_6_hours
          d.precip += ts.data.next_1_hours?.details.precipitation_amount

          const s6 = ts.data.next_6_hours?.summary.symbol_code;

        const days = [...byDay.entries()].slice(0, 5).map(([key, d], i) => {

        const hours = series.filter(ts => ts.data.next_1_hours).slice(0, 12).map(ts => {

          const hh = String(dt.getHours()).padStart(2, "0");
          const hd = ts.data.instant.details;
          const [hIcon, hDesc] = metSymbol(ts.data.next_1_hours.summary.symbol_code);
          const mm = ts.data.next_1_hours.details?.precipitation_amount ?? 0;
          return `<div title="${hh}:00 — ${hDesc}, ${Math.round(hd.air_temperature)}°${mm >= 0.1 ? `, ${mm.toFixed(1)} mm` : ""}">` +
                 `<div class="hn">${hh}</div><div class="hicon">${hIcon}</div>` +
                 `<div>${col(`${Math.round(hd.air_temperature)}°`, tempC(hd.air_temperature))}</div>` +
                 `<div class="hp">${mm >= 0.1 ? mm.toFixed(1) : ""}</div></div>`;
        }).join("");

        // When does it rain? First step with measurable precipitation in 48 h,
        // summarised as one sentence — the question the strip answers in detail.
        const rainAt = series.find(ts => new Date(ts.time) - t0 < 48 * 3600e3 &&
          ((ts.data.next_1_hours ?? ts.data.next_6_hours)?.details?.precipitation_amount ?? 0) >= 0.1);
        let rainLine;
        if (!rainAt) {
          rainLine = "No rain expected in the next 48 h";
        } else if (rainAt === series[0]) {
          rainLine = `Raining now — ${((rainAt.data.next_1_hours ?? rainAt.data.next_6_hours).details.precipitation_amount).toFixed(1)} mm this hour`;
        } else {
          const dt = new Date(rainAt.time);
          const dayWord = dt.toDateString() === now.toDateString() ? "" :
            dt.toDateString() === new Date(now.getTime() + 864e5).toDateString() ? "tomorrow " :
            dt.toLocaleDateString("en-GB", { weekday: "short" }) + " ";
          rainLine = `Rain expected ${dayWord}~${String(dt.getHours()).padStart(2, "0")}:00`;
        }

        let sunChip = "";
        if (sRes.status === "fulfilled" && sRes.value.ok) {
          const sun = (await sRes.value.json()).properties;
          if (sun.sunrise?.time && sun.sunset?.time)
            sunChip = `<span class="chip" title="Sunrise and sunset today">↑ ${sun.sunrise.time.slice(11, 16)} ↓ ${sun.sunset.time.slice(11, 16)}</span>`;
        }

        // Hero shows the temperature pair (actual + feels-like); the place is
        // already in the page header. Footer chips in fixed order: sun · moon
        // · AQI · Kp, attribution apart on the right.
        $("wx").innerHTML = `
          <div class="wx-top">
            <div class="wx-now">
              <span class="i">${icon}</span>
              <span class="t"${tempC(det.air_temperature) ? ` style="color:${tempC(det.air_temperature)}"` : ""}>${Math.round(det.air_temperature)}°</span>
              <span class="d"><b>${desc}</b>${det.apparent_air_temperature != null ? `<span title="Apparent temperature — how it actually feels, factoring in wind and humidity">Feels like ${col(`${Math.round(det.apparent_air_temperature)}°`, tempC(det.apparent_air_temperature))}</span>` : ""}</span>
            </div>
            <div class="wx-days">${days}</div>
          </div>
          ${hours ? `<div class="wx-hours">${hours}</div>` : ""}
          <div class="wx-rainline" title="First hour with ≥ 0.1 mm of precipitation in the 48-hour forecast">☂ ${rainLine}</div>
          <div class="wx-det">${groups}</div>
          <div class="wx-extra" id="wx-extra">${sunChip}<span class="chip" title="Current phase of the moon">${moonPhase(new Date()).join(" ")}</span><span id="wx-aqi"></span><span id="wx-kp"></span><a class="chip src" href="https://www.yr.no/" target="_blank" rel="noopener" title="Forecast data: MET Norway / yr.no (CC BY 4.0)">yr.no</a></div>
          <div class="wx-extra" id="wx-metar" hidden
               title="METAR — raw aviation weather report from the nearest airport with data. Format: station · day+time UTC · wind (degrees/knots) · visibility · clouds · temp/dew point · QNH pressure"></div>`;

        $("wx-upd").textContent = new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", hour12: false });

        loadMetar();

        loadAirQuality();
        loadAurora();
      } catch (err) {
        // Never wipe good content: a failed 30-minute refresh keeps the stale
        // forecast (still roughly right) and the heading stamp betrays its
        // age. The error only shows when there is nothing to keep.
        if (!$("wx").querySelector(".wx-top"))
          $("wx").innerHTML = `<span id="wx-status">Weather unavailable (${err.message})</span>`;
      }
    }

    async function loadAirQuality() {
      try {
        const res = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${LOCATION.lat}&longitude=${LOCATION.lon}&current=european_aqi`);
        const a = await res.json();
        const v = Math.round(a.current.european_aqi);
        $("wx-aqi").innerHTML =
          `<span class="chip" title="European Air Quality Index (Open-Meteo): ≤20 good · ≤40 fair · ≤60 moderate · ≤80 poor · above 80 very poor">AQI ${col(v, aqiC(v))} ${aqiLabel(v)}</span>`;
      } catch { /* leave the line without AQI */ }
    }

    // METAR from the nearest reporting airport. aviationweather.gov has no CORS,
    // so the raw report comes from VATSIM's METAR mirror (same source data).
    const METAR_STATIONS = [
      ["LZIB", 48.170, 17.213], // Bratislava
      ["LZPP", 48.625, 17.828], // Piešťany
      ["LZZI", 49.232, 18.613], // Žilina
      ["LZSL", 48.638, 19.134], // Sliač
      ["LZTT", 49.074, 20.241], // Poprad-Tatry
      ["LZKZ", 48.663, 21.241], // Košice
      ["LOWW", 48.110, 16.570], // Vienna
    ];

    // Raw METAR → readable summary; returns null if the string doesn't parse
    function decodeMetar(raw) {
      const toks = raw.trim().replace(/^(METAR|SPECI)\s+/, "").split(/\s+/);
      const CLOUD = { FEW: "few", SCT: "scattered", BKN: "broken", OVC: "overcast" };
      const WX = { RA: "rain", DZ: "drizzle", SN: "snow", SG: "snow grains", PL: "ice pellets",
                   TS: "thunderstorm", SH: "showers", FG: "fog", BR: "mist", HZ: "haze",
                   FU: "smoke", GR: "hail", GS: "small hail", FZ: "freezing", MI: "shallow", VC: "nearby" };
      const SKIP = ["NOSIG", "AUTO", "COR", "NSC", "NCD", "SKC", "CLR", "TEMPO", "BECMG", "RMK"];
      const p = { icao: toks[0] }, clouds = [], wx = [];
      for (const tok of toks.slice(1)) {
        let m;
        if ((m = tok.match(/^(\d\d)(\d\d)(\d\d)Z$/))) p.time = `${m[2]}:${m[3]}Z`;
        else if ((m = tok.match(/^(\d{3}|VRB)(\d{2,3})(?:G(\d{2,3}))?KT$/))) {
          const dir = m[1] === "VRB" ? "var" : ["N","NE","E","SE","S","SW","W","NW"][Math.round(+m[1] / 45) % 8];
          p.wind = `wind ${dir} ${+m[2]} kt${m[3] ? `, gusts ${+m[3]}` : ""}`;
        }
        else if (tok === "CAVOK") p.vis = "CAVOK (vis ≥10 km, clear)";
        else if ((m = tok.match(/^(\d{4})NDV?$/)) || (m = tok.match(/^(\d{4})$/)))
          p.vis = `vis ${+m[1] >= 9999 ? "≥10" : (+m[1] / 1000).toFixed(+m[1] < 5000 ? 1 : 0)} km`;
        else if ((m = tok.match(/^(FEW|SCT|BKN|OVC)(\d{3})(?:CB|TCU)?$/)))
          clouds.push(`${CLOUD[m[1]]} ${Math.round(+m[2] * 30.48)} m`);
        else if ((m = tok.match(/^(M?\d\d)\/(M?\d\d)$/)))
          p.temp = `${m[1].replace("M", "−")}° / dew ${m[2].replace("M", "−")}°`;
        else if ((m = tok.match(/^Q(\d{3,4})$/))) p.qnh = `${+m[1]} hPa`;
        else if (!SKIP.includes(tok) && (m = tok.match(/^([+-])?((?:[A-Z]{2})+)$/))) {
          let s = m[2]; const parts = [];
          while (s.length >= 2 && WX[s.slice(0, 2)]) { parts.push(WX[s.slice(0, 2)]); s = s.slice(2); }
          if (parts.length && !s.length)
            wx.push((m[1] === "+" ? "heavy " : m[1] === "-" ? "light " : "") + parts.join(" "));
        }
      }
      const bits = [p.icao + (p.time ? " " + p.time : ""), p.wind, p.vis, ...wx,
                    clouds.join(", ") || null, p.temp, p.qnh].filter(Boolean);
      return bits.length > 2 ? bits.join(" · ") : null;
    }

    async function loadMetar() {
      try {
        const d2 = (la, lo) => {
          const dLa = (la - LOCATION.lat) * Math.PI / 180;
          const dLo = (lo - LOCATION.lon) * Math.PI / 180 * Math.cos(LOCATION.lat * Math.PI / 180);
          return dLa * dLa + dLo * dLo;
        };
        const [icao] = METAR_STATIONS.reduce((best, [id, la, lo]) =>
          d2(la, lo) < best[1] ? [id, d2(la, lo)] : best, ["", Infinity]);
        // Direct only as a fallback: some DNS filters block metar.vatsim.net
        const src = `https://metar.vatsim.net/${icao}`;
        const res = await fetch(FEED_PROXY ? viaProxy(src) : src);
        if (!res.ok) throw new Error(res.status);
        const txt = (await res.text()).trim();
        if (!txt) throw new Error("empty");
        const el = $("wx-metar");
        const decoded = decodeMetar(txt);
        el.textContent = "✈ " + (decoded || txt);
        el.title = txt + "  (raw METAR from the nearest reporting airport)";
        el.hidden = false;
      } catch { /* line stays hidden */ }
    }

    // Aurora: NOAA planetary Kp forecast. At ~48°N an aurora needs roughly Kp ≥ 7.
    async function loadAurora() {
      try {
        const res = await fetch("https://services.swpc.noaa.gov/products/noaa-planetary-k-index-forecast.json");
        const rows = await res.json();
        const observed = rows.filter(r => r.observed !== "predicted");
        const kpNow = observed.length ? observed[observed.length - 1].kp : null;
        const kpMax = Math.max(...rows.filter(r => r.observed === "predicted").map(r => r.kp));
        const alert = kpMax >= 7 ? ` <span class="alert">aurora possible!</span>` : "";
        $("wx-kp").innerHTML =
          `<span class="chip" title="Planetary K-index (NOAA) — global geomagnetic activity, 0–9. At Slovak latitude an aurora needs roughly Kp ≥ 7">Kp ${kpNow !== null ? col(kpNow.toFixed(1), kpC(kpNow)) : "?"} (max ${col(kpMax.toFixed(1), kpC(kpMax))})${alert}</span>`;
      } catch { /* leave the line without aurora info */ }
    }

    // Resolve the browser's actual position first; fall back to the default
    // coordinates on decline/timeout. Weather starts either way.
    let PLACE = "";

    // Coordinates → place name (BigDataCloud, keyless and CORS-friendly)
    async function loadPlace() {
      try {
        const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${LOCATION.lat}&longitude=${LOCATION.lon}&localityLanguage=en`);
        const j = await r.json();
        PLACE = j.locality || j.city || "";
        $("c-place-name").textContent = PLACE;
        $("c-place").hidden = !PLACE;
        // Terms used to match weather warnings to this location:
        // town name + region ("Trnavsky kraj") + region without the word "kraj"
        const terms = [j.locality, j.city, j.principalSubdivision,
                       (j.principalSubdivision || "").replace(/\bkraj\b/i, "").trim()]
          .map(norm).filter(t => t.length >= 4);
        if (terms.length) REGION_TERMS = [...new Set(terms)];
      } catch { /* name stays hidden, region terms keep their fallback */ }
    }

    // SHMÚ warnings via MeteoAlarm (their API lacks CORS, so it goes through the
    // worker, or rss2json until that is deployed). Shown only when a warning
    // matches the region derived from the browser's location (fallback: Trnava).
    const WARNING_FEED = "https://feeds.meteoalarm.org/feeds/meteoalarm-legacy-atom-slovakia";
    let REGION_TERMS = ["trnav"];

    async function loadWarnings() {
      try {
        let items;
        if (FEED_PROXY) {
          items = parseFeedXml(await (await fetch(viaProxy(WARNING_FEED))).text());
        } else {
          const data = await (await fetch(
            "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(WARNING_FEED))).json();
          if (data.status !== "ok") return;
          items = data.items;
        }
        const hits = items.filter(it => {
          const text = norm(it.title + " " + it.description);
          return REGION_TERMS.some(t => text.includes(t));
        });
        const box = $("wx-alerts");
        box.hidden = !hits.length;
        box.innerHTML = hits.slice(0, 3).map(it =>
          `<div title="${esc(plainText(it.description)).slice(0, 300)}">⚠︎ ${esc(it.title)}</div>`).join("");
      } catch { /* box stays as-is until the next round */ }
    }

    function startWeather() {
      loadPlace().finally(() => {
        loadWeather();
        loadWarnings();
        setInterval(loadWeather, 30 * 60 * 1000); // refresh every 30 min
        setInterval(loadWarnings, 15 * 60 * 1000);
      });
    }

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        p => { LOCATION = { lat: +p.coords.latitude.toFixed(4), lon: +p.coords.longitude.toFixed(4) }; startWeather(); },
        () => startWeather(),
        { timeout: 5000, maximumAge: 10 * 60 * 1000 }
      );
    } else {
      startWeather();
    }

    /* ================= News ticker (Denník N + Reuters) ================= */

    // RSS feeds send no CORS headers, so they need a proxy. Public proxies are
    // flaky, so each feed is tried through both: rss2json (pre-parsed JSON)
    // first, then a raw fetch parsed with DOMParser in the browser.
    function newsItem(f, it, absolute) {
      // absolute = the timestamp carries its own zone (raw RSS); otherwise
      // rss2json normalises every feed to UTC but drops the zone from its
      // "YYYY-MM-DD HH:MM:SS", so the Z has to be re-attached — without it the
      // string parses as local time and headlines read one UTC offset early.
      const raw = (it.pubDate || "").trim();
      const d = absolute ? new Date(raw)
              : new Date(raw.replace(" ", "T") + "Z");
      const body = plainText(it.description);
      return {
        src: f.name,
        dot: f.dot,
        link: it.link || "",
        title: (f.full && body ? body : f.strip ? (it.title || "").replace(f.strip, "") : it.title) || body,
        t: isNaN(d) ? 0 : d.getTime(),
        time: isNaN(d) ? "--:--" : d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", hour12: false }),
      };
    }

    // Raw RSS/Atom XML → the item shape newsItem expects
    function parseFeedXml(text) {
      const doc = new DOMParser().parseFromString(text, "text/xml");
      return [...doc.querySelectorAll("item, entry")].map(el => {
        const pick = sel => el.querySelector(sel)?.textContent?.trim() || "";
        const linkEl = el.querySelector("link");
        return {
          title: pick("title"),
          description: pick("description") || pick("summary") || pick("content"),
          link: linkEl?.getAttribute("href") || linkEl?.textContent?.trim() || "",
          pubDate: pick("pubDate") || pick("published") || pick("updated"),
        };
      });
    }

    // Tried in order of trust. The raw-XML routes are preferred over rss2json
    // because the original timestamps keep their zone, so they cannot be
    // misread the way rss2json's zone-stripped UTC once was.
    async function fetchFeed(f) {
      if (FEED_PROXY) {
        try { // 1 — our own worker
          const r = await fetch(viaProxy(f.url));
          const items = parseFeedXml(await r.text());
          if (items.length) return items.map(it => newsItem(f, it, true));
        } catch { /* fall through */ }
      }

      try { // 2 — rss2json (free tier, no SLA)
        const r = await fetch("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(f.url));
        const d = await r.json();
        if (d.status === "ok" && d.items?.length) return d.items.map(it => newsItem(f, it, false));
      } catch { /* fall through */ }

      try { // 3 — public CORS proxy; DNS filters block this one on some networks
        const r = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(f.url));
        const items = parseFeedXml(await r.text());
        if (items.length) return items.map(it => newsItem(f, it, true));
      } catch { /* give up on this feed for this round */ }

      return [];
    }

    async function loadTicker() {
      const items = (await Promise.all(TICKER_FEEDS.map(fetchFeed))).flat()
        .filter(it => it.t > Date.now() - 48 * 3600 * 1000) // drop stale items
        .sort((a, b) => b.t - a.t)
        .slice(0, 25);

      const list = $("news-list");
      if (!items.length) {
        // Say so rather than showing an empty box — but never wipe good content
        if (!list.querySelector(".n-item"))
          list.innerHTML = `<div class="n-empty">Feeds unreachable. Retrying every 5 minutes.</div>`;
        return;
      }

      list.innerHTML = items.map(it =>
        `<a class="n-item" href="${esc(it.link)}" target="_blank" rel="noopener" title="${esc(it.title)}">` +
        `<span class="meta">` +
          `<span class="dot" style="background:${it.dot || "var(--muted)"}"></span>` +
          `<span class="src">${it.src}</span>` +
          `<span class="tt">${it.time}</span>` +
        `</span>` +
        `<span class="h">${esc(it.title)}</span></a>`
      ).join("");

      $("news-upd").textContent = new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", hour12: false });
    }

    loadTicker();
    setInterval(loadTicker, 5 * 60 * 1000);

    /* ================= Refresh policy ================= */
    // There is deliberately no whole-page reload. Each source refreshes on its
    // own cadence above (clock 1s · news 5min · warnings 15min · weather 30min,
    // matching the ~30min Expires MET Norway sends). A blanket 5-minute reload
    // used to pre-empt every interval longer than itself, so the weather and
    // warning timers never once fired and every source was re-fetched at the
    // reload's cadence instead of its own.
  </script>
</body>
</html>
